services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sln
      POSTGRES_USER: sln
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54329:5432"
    volumes:
      - sln_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sln -d sln"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  sln_postgres_data:
