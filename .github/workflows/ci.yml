name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sln
          POSTGRES_USER: sln
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sln -d sln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sln@127.0.0.1:5432/sln
      E2E_DATABASE_URL: postgresql://sln@127.0.0.1:5432/sln_e2e
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: public/uploads
      PUBLIC_UPLOAD_BASE_URL: /uploads

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - name: Production build
        env:
          AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
          BETTER_AUTH_SECRET: ci-production-like-secret-with-at-least-thirty-two-characters
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:isolated
      - run: npm audit --audit-level=high
